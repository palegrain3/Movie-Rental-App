<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Movie Rental</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem; color: #222; }
    nav { display: flex; gap: 1rem; padding-bottom: .75rem; border-bottom: 1px solid #ddd; margin-bottom: 1rem; }
    nav a { text-decoration: none; color: #0b5cad; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #eee; }
    th { background: #f5f5f5; }
    form.filters, form.add { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; align-items: end; }
    label { display: flex; flex-direction: column; font-size: .8rem; gap: .2rem; }
    input, select, button { padding: .35rem; font-size: .9rem; }
    .flash { background: #fff6d6; padding: .5rem .75rem; margin-bottom: 1rem; border-radius: 4px; }
    .muted { color: #777; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('movies') }}">Movies</a>
    <a href="{{ url_for('customers') }}">Customers</a>
    <a href="{{ url_for('rentals') }}">Rentals</a>
    <span style="margin-left:auto; display:flex; gap:1rem; align-items:center;">
      {% if session.get('customer_id') %}
        <a href="{{ url_for('account') }}">My account</a>
        <form method="post" action="{{ url_for('logout') }}" style="margin:0"><button>Log out</button></form>
      {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        <a href="{{ url_for('signup') }}">Sign up</a>
      {% endif %}
    </span>
  </nav>
  {% for msg in get_flashed_messages() %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
