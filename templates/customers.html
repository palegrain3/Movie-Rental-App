{% extends "base.html" %}
{% block content %}
<h2>Customers</h2>
<form class="add" method="post" action="{{ url_for('add_customer') }}">
  <label>Name <input name="customer_name" maxlength="100" required></label>
  <label>Email <input name="customer_email" type="email" maxlength="255" required></label>
  <label>Phone <input name="customer_phone" maxlength="12" placeholder="412-555-0101" required></label>
  <label>Password <input name="password" type="password" minlength="6" required></label>
  <button>Add customer</button>
</form>
<table>
  <tr><th>Name</th><th>Email</th><th>Phone</th><th>Signed up</th><th>Rentals</th><th></th></tr>
  {% for c in customers %}
  <tr><td>{{ c.customer_name }}</td><td>{{ c.customer_email }}</td><td>{{ c.customer_phone }}</td>
      <td>{{ c.signup_date }}</td><td>{{ c.rental_count }}</td>
      <td>
        <form method="post" action="{{ url_for('delete_customer', customer_id=c.customer_id) }}"
              onsubmit="return confirm('Remove {{ c.customer_name|e }}? Their rentals will be removed too.');">
          <button>Remove</button>
        </form>
      </td></tr>
  {% else %}<tr><td colspan="6" class="muted">No customers yet. Add one above.</td></tr>{% endfor %}
</table>
{% endblock %}
